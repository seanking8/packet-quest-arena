sonar.projectKey=packet-quest-arena
sonar.projectName=Packet Quest Arena

# Sources and tests must be disjoint. Frontend tests live in frontend/src as
# *.test.jsx / the tests/ folder, so we point sources + tests at the same
# frontend root but use inclusion patterns to split them.
sonar.sources=backend/src/main,frontend/src,simulator
sonar.tests=backend/src/test,frontend/src,simulator/tests
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/tests/**
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/build/**,**/*.min.js,**/coverage/**,**/__pycache__/**,frontend/public/**,**/*.test.js,**/*.test.jsx,frontend/src/tests/**

sonar.java.binaries=backend/target/classes
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=simulator/coverage.xml

# Backend JUnit/JaCoCo coverage (generated by `mvn test`; see notes below).
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

sonar.sourceEncoding=UTF-8

# Tests themselves aren't measured for coverage of test code.
sonar.test.exclusions=**/node_modules/**,**/target/**,**/dist/**
# 3D WebGL scenes can't be unit-tested in jsdom (no WebGL); excluded from
# coverage and verified by build + manual/visual checks instead. Matches
# frontend/vite.config.js coverage.exclude.
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/tests/**,**/setupTests.js,**/*Test.java,**/PacketQuestApplication.java,**/main.jsx,frontend/src/components/map/NetworkScene.jsx,frontend/src/components/map/DistrictScene.jsx,frontend/src/components/map/TutorialDistrictScene.jsx,frontend/src/components/map/PlanetScene.jsx,frontend/src/components/map/cityDetails.jsx,frontend/src/components/map/IncidentZones.jsx

# NOTE: coverage report paths are wired up but the reports must be generated
# first (see docs / README). Until then SonarQube shows 0% coverage rather
# than failing — no fake results are committed.
