# Test profile. Most tests use the in-memory game repository and keep the
# persistence audit layer disabled, but an H2 database is available for the
# dedicated persistence integration test.
spring.datasource.url=jdbc:h2:mem:packetquest-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
packetquest.persistence.enabled=false

# Effectively disable the scheduled auto-tick during tests so it cannot mutate
# state mid-assertion; tests drive ticks explicitly when they need them.
packetquest.tick.fixed-rate-ms=600000
