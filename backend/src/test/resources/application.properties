# Test profile. Game state lives in an in-memory repository, so the JPA / MySQL
# auto-configuration is not needed and would otherwise try (and fail) to reach a
# database during a full @SpringBootTest. Exclude it so the context starts
# cleanly with no external dependencies.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# Effectively disable the scheduled auto-tick during tests so it cannot mutate
# state mid-assertion; tests drive ticks explicitly when they need them.
packetquest.tick.fixed-rate-ms=600000
