spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/packetquest}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pquser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pqpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Actuator health for container / k8s probes. Expose only the health endpoint
# and enable the liveness/readiness probe groups
# (/actuator/health/liveness and /actuator/health/readiness).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
