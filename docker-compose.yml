services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-packetquest}
      MYSQL_USER: ${MYSQL_USER:-pquser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pqpassword}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-packetquest}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-pquser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-pqpassword}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Plain TCP check on 8080 using the JRE (no curl in the slim image).
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  simulator:
    build: ./simulator
    environment:
      BACKEND_URL: http://backend:8080
      SESSION_ID: ${SESSION_ID:-}
      SIMULATOR_SEED: ${SIMULATOR_SEED:-42}
      SIMULATOR_COUNT: ${SIMULATOR_COUNT:-0}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
